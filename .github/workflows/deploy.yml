name: CI-WORKFLOW
on:
  push:
    branches: [ "master", "main", "dev" ]
  workflow_dispatch:

jobs:
  build-test:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'  
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [18, 20, 22]
        exclude:
          - os: windows-latest
            node-version: 22
   
    steps:
      - name: checkout
        uses: actions/checkout@v7

      - name: Cache Dependencies
        uses: actions/cache@v5
        with:
          path: ~/.npm



  

